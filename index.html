<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="截止日历">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<title>截止日历</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #fff; color: #1d1d1f; font-size: 15px; line-height: 1.5;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 20px 60px; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .month-title { font-size: 21px; font-weight: 600; letter-spacing: -0.3px; }
  .nav-btns { display: flex; align-items: center; gap: 4px; }
  .nav-btn { width: 36px; height: 36px; border: none; background: none; border-radius: 50%;
    font-size: 19px; color: #1d1d1f; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .nav-btn:active { background: #f2f2f4; }
  .today-btn { border: none; background: none; font-size: 13px; color: #86868b; cursor: pointer;
    padding: 6px 10px; border-radius: 14px; }
  .today-btn:active { background: #f2f2f4; }

  /* 倒计时卡 */
  .next-card {
    margin: 14px 0 20px; padding: 20px 22px; border-radius: 18px; background: #f5f5f7;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .next-info { min-width: 0; }
  .next-label { font-size: 12px; color: #86868b; margin-bottom: 3px; }
  .next-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next-date { font-size: 12.5px; color: #86868b; margin-top: 3px; }
  .next-count { text-align: center; flex-shrink: 0; }
  .next-days { font-size: 58px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: #1d1d1f; font-variant-numeric: tabular-nums; }
  .next-days-unit { font-size: 12px; color: #86868b; margin-top: 5px; }
  .next-card.urgent .next-days { color: #d93025; }
  .next-card.urgent .next-days-unit { color: #d93025; font-weight: 500; }

  /* 日历 */
  .cal { margin-bottom: 8px; }
  .week-head { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #86868b; margin-bottom: 4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
  .cell {
    height: 47px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; cursor: pointer; border-radius: 10px; position: relative;
  }
  .cell:active { background: #f2f2f4; }
  .badge {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: transparent; transition: background 0.15s;
  }
  .badge .num { font-size: 14.5px; font-weight: 400; line-height: 1; }
  .cell.dim .num { color: #c7c7cc; }
  .cell.today .badge { background: #1d1d1f; }
  .cell.today .num { color: #fff; font-weight: 500; }
  /* 事件底色（今天让位给事件色） */
  .cell.has-event .badge { background: rgba(var(--ev-rgb), 0.22); }
  /* 但今天优先：今天+有事项时仍显示黑圈，方框保留类型色 */
  .cell.today.has-event .badge { background: #1d1d1f; }
  /* 重：圈同轻，外面加方形描边框 */
  .cell.heavy { border: 1.5px solid rgb(var(--ev-rgb)); }
  .cell.heavy .num { font-weight: 600; }
  /* 多个事件时的小点 */
  .dots { display: flex; gap: 3px; height: 5px; align-items: center; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }

  /* 图例 */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center;
    font-size: 11.5px; color: #86868b; margin-top: 10px; }
  .legend .lg { display: flex; align-items: center; gap: 5px; }
  .legend .sw { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: rgba(0,0,0,0.18); }
  .legend .sw.heavy { background: rgba(0,0,0,0.18); box-shadow: 0 0 0 1.5px rgba(0,0,0,0.7); border-radius: 3px; }

  /* 重点卡片区 */
  .projects { margin-top: 26px; }
  .projects-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .section-title { font-size: 13px; color: #86868b; font-weight: 500; }
  .add-proj { border: none; background: none; font-size: 12.5px; color: #86868b; cursor: pointer; padding: 4px 8px; border-radius: 10px; }
  .add-proj:active { background: #f2f2f4; }
  .proj-card {
    display: flex; align-items: center; gap: 12px; padding: 14px 14px;
    border-radius: 14px; margin-bottom: 8px; cursor: pointer;
    background: #f5f5f7;
  }
  .proj-card:active { background: #ececef; }
  .proj-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .proj-body { flex: 1; min-width: 0; }
  .proj-title { font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-sub { font-size: 12px; color: #86868b; margin-top: 2px; }
  .proj-count { text-align: right; flex-shrink: 0; }
  .proj-n { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .proj-u { font-size: 11px; color: #86868b; margin-top: 2px; }
  .proj-card.urgent .proj-n { color: #d93025; }
  .proj-card.urgent .proj-u { color: #d93025; font-weight: 500; }
  .proj-card .ed { font-size: 12px; color: #c7c7cc; margin-top: 3px; }

  /* 列表 */
  .list-section { margin-top: 26px; }
  .month-group { font-size: 13px; color: #86868b; margin: 14px 0 2px; font-weight: 500; }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 12px 2px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08); cursor: pointer;
  }
  .item:active { background: #fafafa; }
  .item .bar { width: 3.5px; height: 32px; border-radius: 2px; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .t { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .d { font-size: 12.5px; color: #86868b; margin-top: 1px; }
  .item .left { display: flex; align-items: baseline; gap: 2px; flex-shrink: 0; }
  .item .left .n { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; color: #1d1d1f; font-variant-numeric: tabular-nums; }
  .item .left .u { font-size: 11px; color: #86868b; }
  .item .left.hot .n { color: #d93025; }
  .empty { color: #c7c7cc; font-size: 14px; padding: 18px 0; text-align: center; }

  /* 钱区块 */
  .money { margin-top: 30px; padding: 18px; border-radius: 16px; background: #f5f5f7; }
  .money h3 { font-size: 13px; color: #86868b; font-weight: 500; margin-bottom: 14px; }
  .money-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid rgba(0,0,0,0.06); }
  .money-row:last-of-type { border-bottom: none; }
  .money-row label { font-size: 14px; color: #1d1d1f; flex: 1; }
  .money-row input { width: 110px; border: none; background: none; text-align: right; font-size: 15px; font-weight: 600;
    font-family: inherit; color: #1d1d1f; outline: none; padding: 4px 0; }
  .money-row input::placeholder { color: #c7c7cc; font-weight: 400; }
  .money-note { font-size: 12.5px; color: #86868b; margin-top: 10px; line-height: 1.6; }

  /* 累计 */
  .stats { margin-top: 30px; }
  .stats h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .stats-sum { display: flex; gap: 8px; margin-bottom: 6px; }
  .stat-chip { flex: 1; background: #f5f5f7; border-radius: 12px; padding: 10px 12px; }
  .stat-chip .k { font-size: 11px; color: #86868b; }
  .stat-chip .v { font-size: 14.5px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
  .stat-month { font-size: 13px; color: #86868b; margin: 14px 0 2px; font-weight: 500; }
  .stat-item { display: flex; align-items: center; gap: 10px; padding: 10px 2px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08); cursor: pointer; }
  .stat-item .si-main { flex: 1; min-width: 0; }
  .stat-item .si-title { font-size: 14.5px; }
  .stat-item .si-sub { font-size: 12px; color: #86868b; margin-top: 1px; }
  .stat-item .si-val { font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .stats-empty { font-size: 13px; color: #86868b; padding: 8px 0 2px; line-height: 1.6; }
  .stats-add { width: 100%; padding: 12px 0; margin-top: 14px; border: 1.5px dashed rgba(0,0,0,0.18);
    border-radius: 13px; background: none; color: #86868b; font-size: 14px; cursor: pointer; font-family: inherit; }

  .tools { display: flex; gap: 10px; margin-top: 26px; }
  .tool-btn { flex: 1; padding: 11px 0; border: none; background: #f5f5f7; border-radius: 12px;
    font-size: 13.5px; color: #1d1d1f; cursor: pointer; font-family: inherit; }
  .tool-btn:active { background: #e8e8ea; }

  /* 弹层 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.32); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 520px; background: #fff; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 82vh; overflow-y: auto; }
  .overlay.show .sheet { transform: translateY(0); }
  .sheet h2 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: #86868b; margin-bottom: 6px; }
  .field input[type=text], .field input[type=number], .field input[type=date] {
    width: 100%; border: none; background: #f5f5f7; border-radius: 10px; padding: 11px 14px;
    font-size: 15.5px; font-family: inherit; color: #1d1d1f; outline: none;
  }
  .type-row { display: flex; gap: 8px; }
  .type-chip { flex: 1; padding: 9px 0; border-radius: 10px; border: 1.5px solid rgba(0,0,0,0.08);
    background: #fff; font-size: 13.5px; color: #1d1d1f; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px; }
  .type-chip .cdot { width: 8px; height: 8px; border-radius: 50%; }
  .type-chip.on { border-color: #1d1d1f; font-weight: 600; }
  .repeat-row { display: flex; gap: 8px; }
  .rep-chip { flex: 1; padding: 9px 0; border-radius: 10px; border: 1.5px solid rgba(0,0,0,0.08);
    background: #fff; font-size: 13.5px; cursor: pointer; font-family: inherit; color: #1d1d1f; }
  .rep-chip.on { border-color: #1d1d1f; font-weight: 600; }
  .weight-row { display: flex; gap: 8px; }
  .weight-chip { flex: 1; padding: 9px 0; border-radius: 10px; border: 1.5px solid rgba(0,0,0,0.08);
    background: #fff; font-size: 13.5px; cursor: pointer; font-family: inherit; color: #1d1d1f; }
  .weight-chip.on { border-color: #1d1d1f; font-weight: 600; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-main { flex: 1; padding: 13px 0; border: none; background: #1d1d1f; color: #fff;
    border-radius: 13px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-main:active { opacity: 0.8; }
  .btn-ghost { padding: 13px 18px; border: none; background: #f5f5f7; color: #d93025;
    border-radius: 13px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .btn-ghost.gray { color: #1d1d1f; }
  .sheet .mini-title { font-size: 13px; color: #86868b; margin: 4px 0 8px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
    background: #1d1d1f; color: #fff; font-size: 13.5px; padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: all 0.25s; z-index: 99; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .import-area { width: 100%; height: 90px; border: none; background: #f5f5f7; border-radius: 10px;
    padding: 11px 14px; font-size: 12px; font-family: ui-monospace, monospace; outline: none; resize: none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="nav">
    <div class="month-title" id="monthTitle"></div>
    <div class="nav-btns">
      <button class="today-btn" id="btnToday">今天</button>
      <button class="nav-btn" id="btnPrev">‹</button>
      <button class="nav-btn" id="btnNext">›</button>
    </div>
  </div>

  <div class="next-card" id="nextCard">
    <div class="next-info">
      <div class="next-label" id="nextLabel">下一个截止</div>
      <div class="next-title" id="nextTitle"></div>
      <div class="next-date" id="nextDate"></div>
    </div>
    <div class="next-count">
      <div class="next-days" id="nextDays"></div>
      <div class="next-days-unit" id="nextUnit"></div>
    </div>
  </div>

  <div class="cal">
    <div class="week-head">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="projects" id="projects"></div>

  <div class="list-section">
    <div class="section-title" id="listTitle">接下来的截止</div>
    <div id="list"></div>
  </div>

  <div class="money">
    <h3>钱</h3>
    <div class="stats-sum" id="incomeSum"></div>
    <div id="incomeList"></div>
    <button class="stats-add" id="btnAddIncome">＋ 记一笔收入</button>
  </div>

  <div class="stats">
    <h3>累计</h3>
    <div class="stats-sum" id="statsSum"></div>
    <div id="statsList"></div>
    <button class="stats-add" id="btnAddStat">＋ 记一笔（稿子 / 视频 / 挣钱）</button>
  </div>

  <div class="tools">
    <button class="tool-btn" id="btnExport">导出备份</button>
    <button class="tool-btn" id="btnImport">导入数据</button>
    <button class="tool-btn" id="btnAdd">＋ 添加</button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var KEY = 'deadlineCalendar.v2';

  var TYPES = {
    expense: { name: '支出', color: '#BA7517' },
    deadline: { name: '截稿', color: '#185FA5' },
    game: { name: '游戏', color: '#534AB7' },
    other: { name: '其他', color: '#0F6E56' }
  };

  // 颜色 → rgb（用于 rgba 半透明）
  function toRgb(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16);
  }
  var TYPE_RGB = {};
  Object.keys(TYPES).forEach(function (k) { TYPE_RGB[k] = toRgb(TYPES[k].color); });

  // 旧版数据迁移：v1 没有 weight/startDate；v2 迁移时把重点项目误标成了 light
  var HEAVY_PRESETS = [
    { match: /伏笔/i, startDate: '2026-09-16' },
    { match: /影之刃/i, startDate: '2026-10-15' },
    { match: /GTA/i, startDate: '2026-11-05' }
  ];
  function migrate(d) {
    if (!d) return null;
    if (d.version === 5) return d;
    d.version = 5;
    (d.events || []).forEach(function (ev) {
      if (!ev.weight) ev.weight = 'light';
      // v2 迁移 bug 修复：三个重点项目按标题识别，恢复 heavy + 开工日
      if (ev.weight !== 'heavy') {
        HEAVY_PRESETS.forEach(function (p) {
          if (ev.title && p.match.test(ev.title)) {
            ev.weight = 'heavy';
            if (!ev.startDate) ev.startDate = p.startDate;
          }
        });
      }
    });
    if (!d.stats) d.stats = [];
    if (!d.incomes) d.incomes = [];
    return d;
  }

  var SEED = {
    version: 5,
    events: [
      { id: 'e1', title: '五险一金', type: 'expense', day: 20, repeat: 'monthly', weight: 'light' },
      { id: 'e2', title: '房租', type: 'expense', day: 30, repeat: 'monthly', weight: 'light' },
      { id: 'e3', title: '外稿一篇', type: 'deadline', day: 15, repeat: 'monthly', weight: 'light' },
      { id: 'e4', title: '伏笔计划投稿（鲤）', type: 'deadline', date: '2026-11-03', startDate: '2026-09-16', weight: 'heavy' },
      { id: 'e5', title: '影之刃0 · 视频上线', type: 'game', date: '2026-10-29', startDate: '2026-10-15', weight: 'heavy' },
      { id: 'e6', title: 'GTA6 · 视频上线', type: 'game', date: '2026-11-19', startDate: '2026-11-05', weight: 'heavy' }
    ],
    money: { balance: '', goal: '', per: '' },
    incomes: [],
    stats: []
  };

  var state = load();
  var viewY, viewM;
  viewY = now0().getFullYear(); viewM = now0().getMonth();
  function now0() { return new Date(); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        var m = migrate(d);
        if (m && m.events) return m;
      }
      // 兼容 v1 key
      var old = localStorage.getItem('deadlineCalendar.v1');
      if (old) {
        var od = JSON.parse(old);
        var om = migrate(od);
        if (om && om.events) {
          localStorage.setItem(KEY, JSON.stringify(om));
          return om;
        }
      }
      localStorage.setItem(KEY, JSON.stringify(SEED));
      return JSON.parse(JSON.stringify(SEED));
    } catch (e) { return JSON.parse(JSON.stringify(SEED)); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- 日期工具 ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function toStr(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parseStr(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayStr() { var t = now0(); return toStr(t.getFullYear(), t.getMonth(), t.getDate()); }
  function daysLeft(dateStr) {
    var a = parseStr(todayStr()), b = parseStr(dateStr);
    return Math.round((b - a) / 86400000);
  }
  function fmtDate(dateStr) {
    var d = parseStr(dateStr);
    var wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 · 周' + wd;
  }
  function fmtShort(dateStr) {
    var d = parseStr(dateStr);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  function eventDateIn(ev, y, m) {
    if (ev.repeat === 'monthly') {
      var dim = daysInMonth(y, m);
      var d = Math.min(ev.day, dim);
      return toStr(y, m, d);
    }
    if (ev.date) {
      var p = ev.date.split('-');
      if (+p[0] === y && (+p[1] - 1) === m) return ev.date;
      return null;
    }
    return null;
  }

  // 该事件的所有未来出现（去重：每月重复只保留最近一次）
  function upcomingAll() {
    var out = [];
    var seenMonthly = {};
    state.events.forEach(function (ev) {
      for (var off = -1; off <= 12; off++) {
        var d = new Date(viewY, viewM + off, 1);
        var ds = eventDateIn(ev, d.getFullYear(), d.getMonth());
        if (!ds) continue;
        var dl = daysLeft(ds);
        if (dl < 0) continue;
        if (ev.repeat === 'monthly') {
          if (seenMonthly[ev.id]) continue;
          seenMonthly[ev.id] = true;
        }
        out.push({ ev: ev, date: ds, daysLeft: dl });
      }
    });
    out.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    return out;
  }

  // 重点：weight=heavy 的事件
  function heavyEvents() {
    return state.events.filter(function (ev) { return ev.weight === 'heavy'; });
  }

  // 重点卡片的"距多少天"：开工日切换
  function projectDelta(ev) {
    if (ev.startDate) {
      var sdl = daysLeft(ev.startDate);
      if (sdl > 0) return { kind: 'start', days: sdl, urgent: sdl <= 7 };
    }
    var dl = daysLeft(ev.date);
    return { kind: 'end', days: dl, urgent: dl <= 7 };
  }

  // 倒计时卡显示：所有事件的最近出现（含每月重复）+ 重点项目的开工日，取最近
  function nextForCard() {
    var best = null;
    function consider(ev, dateStr, kind) {
      var dl = daysLeft(dateStr);
      if (dl < 0) return;
      if (!best || dl < best.days) best = { ev: ev, kind: kind, days: dl, dateStr: dateStr };
    }
    state.events.forEach(function (ev) {
      if (ev.weight === 'heavy' && ev.startDate) consider(ev, ev.startDate, 'start');
      if (ev.repeat === 'monthly') {
        var t = now0();
        var ds = eventDateIn(ev, t.getFullYear(), t.getMonth());
        if (daysLeft(ds) < 0) {
          var nm = new Date(t.getFullYear(), t.getMonth() + 1, 1);
          ds = eventDateIn(ev, nm.getFullYear(), nm.getMonth());
        }
        if (ds && daysLeft(ds) >= 0) consider(ev, ds, 'end');
      } else if (ev.date) {
        consider(ev, ev.date, 'end');
      }
    });
    return best;
  }

  // ---------- 渲染 ----------
  function render() {
    renderTitle(); renderCal(); renderLegend(); renderProjects(); renderList(); renderNext(); renderMoney(); renderStats();
  }

  function renderLegend() {
    var el = document.getElementById('legend');
    el.innerHTML =
      '<span class="lg"><span class="sw" style="background:#BA7517"></span>支出</span>' +
      '<span class="lg"><span class="sw" style="background:#185FA5"></span>截稿</span>' +
      '<span class="lg"><span class="sw" style="background:#534AB7"></span>游戏</span>' +
      '<span class="lg"><span class="sw" style="background:#0F6E56"></span>其他</span>';
  }

  function renderTitle() {
    document.getElementById('monthTitle').textContent = viewY + '年' + (viewM + 1) + '月';
  }

  function eventsOn(dateStr) {
    var list = [];
    state.events.forEach(function (ev) {
      var ds = eventDateIn(ev, +dateStr.split('-')[0], +dateStr.split('-')[1] - 1);
      if (ds === dateStr) list.push(ev);
    });
    return list;
  }

  function renderCal() {
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    var first = new Date(viewY, viewM, 1);
    var startDay = first.getDay();
    var dim = daysInMonth(viewY, viewM);
    var prevDim = daysInMonth(viewM === 0 ? viewY - 1 : viewY, viewM === 0 ? 11 : viewM - 1);
    var tStr = todayStr();
    var cells = startDay + dim;
    var totalCells = Math.ceil(cells / 7) * 7;
    for (var i = 0; i < totalCells; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var dayNum, dateStr;
      if (i < startDay) {
        dayNum = prevDim - startDay + 1 + i;
        cell.classList.add('dim');
      } else if (i >= cells) {
        dayNum = i - cells + 1;
        cell.classList.add('dim');
      } else {
        dayNum = i - startDay + 1;
        dateStr = toStr(viewY, viewM, dayNum);
        var evs = eventsOn(dateStr);
        if (evs.length) {
          var primary = evs.find(function (e) { return e.weight === 'heavy'; }) || evs[0];
          cell.classList.add('has-event');
          cell.style.setProperty('--ev-rgb', TYPE_RGB[primary.type] || '0,0,0');
          if (primary.weight === 'heavy') cell.classList.add('heavy');
          if (evs.length > 1) {
            var dots = document.createElement('div');
            dots.className = 'dots';
            evs.forEach(function (ev) {
              var d = document.createElement('span');
              d.className = 'dot';
              d.style.background = TYPES[ev.type] ? TYPES[ev.type].color : '#86868b';
              dots.appendChild(d);
            });
            cell.appendChild(dots);
          }
        }
        if (dateStr === tStr) cell.classList.add('today');
        (function (ds) {
          cell.addEventListener('click', function () { openDaySheet(ds); });
        })(dateStr);
      }
      var badge = document.createElement('div');
      badge.className = 'badge';
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = dayNum;
      badge.appendChild(num);
      cell.appendChild(badge);
      grid.appendChild(cell);
    }
  }

  function renderNext() {
    var n = nextForCard();
    var card = document.getElementById('nextCard');
    var titleEl = document.getElementById('nextTitle');
    var dateEl = document.getElementById('nextDate');
    var labelEl = document.getElementById('nextLabel');
    var daysEl = document.getElementById('nextDays');
    var unitEl = document.getElementById('nextUnit');
    if (!n) {
      labelEl.textContent = '下一个截止';
      titleEl.textContent = '暂时没有截止';
      dateEl.textContent = '';
      daysEl.textContent = '—';
      unitEl.textContent = '';
      card.classList.remove('urgent');
      return;
    }
    titleEl.textContent = n.ev.title;
    var repeatNote = n.ev.repeat === 'monthly' ? ' · 每月' + n.ev.day + '日' : '';
    dateEl.textContent = fmtDate(n.dateStr) + repeatNote;
    daysEl.textContent = n.days;
    var urgent = n.days <= 7;
    if (n.kind === 'start') {
      labelEl.textContent = '重点 · 该开工了';
      unitEl.textContent = n.days === 0 ? '今天开工' : '天后开工';
    } else {
      labelEl.textContent = n.ev.weight === 'heavy' ? '重点 · 截稿' : '下一个截止';
      unitEl.textContent = n.days === 0 ? '就是今天' : '天后到期';
    }
    card.classList.toggle('urgent', urgent);
  }

  function renderProjects() {
    var box = document.getElementById('projects');
    var list = heavyEvents();
    if (!list.length) { box.innerHTML = ''; return; }
    var html = '<div class="projects-head"><div class="section-title">重点长期项目</div>' +
      '<button class="add-proj" id="addProjBtn">＋ 添加</button></div>';
    list.forEach(function (ev) {
      var color = TYPES[ev.type] ? TYPES[ev.type].color : '#86868b';
      var d = projectDelta(ev);
      var nTxt = d.days === 0 ? '今天' : d.days;
      var uTxt = d.kind === 'start' ? (d.days === 0 ? '' : '天后开工') : (d.days === 0 ? '' : '天后截稿');
      var leftHTML;
      if (d.kind === 'start') {
        leftHTML = '<div class="proj-n">' + nTxt + '</div><div class="proj-u">' + uTxt + '</div>';
      } else {
        leftHTML = '<div class="proj-n">' + nTxt + '</div><div class="proj-u">' + uTxt + '</div>';
      }
      var sub = ev.startDate
        ? '开工 ' + fmtShort(ev.startDate) + ' → 截稿 ' + fmtShort(ev.date)
        : '截稿 ' + fmtShort(ev.date);
      var sub2 = '';
      if (ev.startDate) {
        var span = Math.round((parseStr(ev.date) - parseStr(ev.startDate)) / 86400000);
        if (span >= 0) sub2 = '（共 ' + span + ' 天）';
      }
      html +=
        '<div class="proj-card' + (d.urgent ? ' urgent' : '') + '" data-id="' + ev.id + '">' +
        '<div class="proj-dot" style="background:' + color + '"></div>' +
        '<div class="proj-body"><div class="proj-title">' + escapeHTML(ev.title) + '</div>' +
        '<div class="proj-sub">' + sub + '</div>' +
        (sub2 ? '<div class="proj-sub">' + sub2 + '</div>' : '') + '</div>' +
        '<div class="proj-count">' + leftHTML + '</div></div>';
    });
    box.innerHTML = html;
    box.querySelectorAll('.proj-card').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        var ev = state.events.find(function (e) { return e.id === id; });
        if (ev) openEditSheet(ev);
      });
    });
    var apb = document.getElementById('addProjBtn');
    if (apb) apb.addEventListener('click', function () { openAddSheet(null, true); });
  }

  function renderList() {
    var box = document.getElementById('list');
    box.innerHTML = '';
    var ups = upcomingAll().filter(function (u) { return u.ev.weight !== 'heavy'; });
    if (!ups.length) {
      box.innerHTML = '<div class="empty">未来没有截止事项</div>';
      return;
    }
    var lastMonth = '';
    ups.forEach(function (u) {
      var mKey = u.date.slice(0, 7);
      if (mKey !== lastMonth) {
        lastMonth = mKey;
        var h = document.createElement('div');
        h.className = 'month-group';
        h.textContent = +u.date.split('-')[1] + '月';
        box.appendChild(h);
      }
      var item = document.createElement('div');
      item.className = 'item';
      var color = TYPES[u.ev.type] ? TYPES[u.ev.type].color : '#86868b';
      var leftCls = 'left', leftHTML;
      if (u.daysLeft === 0) {
        leftHTML = '<span class="n" style="color:#d93025;font-size:19px">今天</span>';
        leftCls += ' hot';
      } else {
        var hot = u.daysLeft <= 3;
        if (hot) leftCls += ' hot';
        leftHTML = '<span class="n">' + u.daysLeft + '</span><span class="u">天</span>';
      }
      var repeatNote = u.ev.repeat === 'monthly' ? ' · 每月' + u.ev.day + '日' : '';
      item.innerHTML =
        '<div class="bar" style="background:' + color + '"></div>' +
        '<div class="info"><div class="t"></div><div class="d"></div></div>' +
        '<div class="' + leftCls + '">' + leftHTML + '</div>';
      item.querySelector('.t').textContent = u.ev.title;
      item.querySelector('.d').textContent = fmtDate(u.date) + repeatNote;
      (function (ev) {
        item.addEventListener('click', function () { openEditSheet(ev); });
      })(u.ev);
      box.appendChild(item);
    });
  }

  function renderMoney() {
    if (!state.incomes) state.incomes = [];
    var sumEl = document.getElementById('incomeSum');
    var listEl = document.getElementById('incomeList');
    var year = now0().getFullYear();
    var monthKey = todayStr().slice(0, 7);
    function sumOf(list) { var t = 0; list.forEach(function (r) { t += (+r.amount || 0); }); return t; }
    var thisYear = state.incomes.filter(function (r) { return (r.date || '').slice(0, 4) === String(year); });
    var thisMonth = thisYear.filter(function (r) { return (r.date || '').slice(0, 7) === monthKey; });
    var mo = sumOf(thisMonth), yr = sumOf(thisYear);
    sumEl.innerHTML =
      '<div class="stat-chip"><div class="k">本月收入</div><div class="v">' + (mo ? fmtMoney(mo) : '—') + '</div></div>' +
      '<div class="stat-chip"><div class="k">今年收入</div><div class="v">' + (yr ? fmtMoney(yr) : '—') + '</div></div>';
    if (!state.incomes.length) { listEl.innerHTML = ''; return; }
    var groups = {};
    state.incomes.forEach(function (r) { var k = (r.date || '').slice(0, 7); (groups[k] = groups[k] || []).push(r); });
    var keys = Object.keys(groups).sort().reverse();
    var html = '';
    keys.forEach(function (k) {
      var g = groups[k];
      var label = k.slice(0, 4) === String(year) ? (+k.slice(5, 7)) + '月' : k.slice(0, 4) + '年' + (+k.slice(5, 7)) + '月';
      html += '<div class="stat-month">' + label + ' · ' + fmtMoney(sumOf(g)) + '</div>';
      g.sort(function (a, b) { return (b.date || '') < (a.date || '') ? -1 : 1; });
      g.forEach(function (r) {
        var sub = fmtShort(r.date) + (r.note ? ' · ' + escapeHTML(r.note) : '');
        html += '<div class="stat-item" data-id="' + r.id + '">' +
          '<div class="si-main"><div class="si-title">' + escapeHTML(r.type || '收入') + '</div><div class="si-sub">' + sub + '</div></div>' +
          '<div class="si-val">+' + fmtMoney(r.amount) + '</div></div>';
      });
    });
    listEl.innerHTML = html;
    listEl.querySelectorAll('.stat-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        var r = state.incomes.find(function (x) { return x.id === id; });
        if (r) openIncomeViewSheet(r);
      });
    });
  }

  // ---------- 弹层 ----------
  var overlay = document.getElementById('overlay');
  var sheet = document.getElementById('sheet');
  function openSheet(html) { sheet.innerHTML = html; overlay.classList.add('show'); }
  function closeSheet() { overlay.classList.remove('show'); }
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSheet(); });

  function escapeHTML(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function typeChipsHTML(sel) {
    return Object.keys(TYPES).map(function (k) {
      var t = TYPES[k];
      return '<button class="type-chip' + (k === sel ? ' on' : '') + '" data-type="' + k + '">' +
        '<span class="cdot" style="background:' + t.color + '"></span>' + t.name + '</button>';
    }).join('');
  }
  function weightChipsHTML(sel) {
    return '<button class="weight-chip' + (sel === 'light' ? ' on' : '') + '" data-w="light">轻 · 到点干</button>' +
      '<button class="weight-chip' + (sel === 'heavy' ? ' on' : '') + '" data-w="heavy">重 · 长期项目</button>';
  }

  function openDaySheet(dateStr) {
    var evs = [];
    state.events.forEach(function (ev) {
      var ds = eventDateIn(ev, +dateStr.split('-')[0], +dateStr.split('-')[1] - 1);
      if (ds === dateStr) evs.push(ev);
    });
    var html = '<h2>' + fmtDate(dateStr) + '</h2>';
    if (evs.length) {
      html += '<div class="day-events">';
      evs.forEach(function (ev) {
        html += '<div class="item" data-id="' + ev.id + '">' +
          '<div class="bar" style="background:' + TYPES[ev.type].color + '"></div>' +
          '<div class="info"><div class="t"></div><div class="d"></div></div><div class="left" style="color:#c7c7cc">编辑 ›</div></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="mini-title">这天没有事项</div>';
    }
    html += '<div class="sheet-actions"><button class="btn-main" id="shAdd">在这一天添加</button>' +
      '<button class="btn-ghost gray" id="shClose">关闭</button></div>';
    openSheet(html);
    var items = sheet.querySelectorAll('.item');
    items.forEach(function (el, i) { el.querySelector('.t').textContent = evs[i].title; el.querySelector('.d').textContent = evs[i].weight === 'heavy' ? '重点长期项目' : (evs[i].repeat === 'monthly' ? '每月重复' : '仅此一次'); });
    items.forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        var ev = state.events.find(function (e) { return e.id === id; });
        if (ev) openEditSheet(ev);
      });
    });
    document.getElementById('shAdd').addEventListener('click', function () { openAddSheet(dateStr); });
    document.getElementById('shClose').addEventListener('click', closeSheet);
  }

  function openAddSheet(dateStr, forceHeavy) {
    dateStr = dateStr || todayStr();
    var p = dateStr.split('-');
    var d = +p[2];
    var defaultType = forceHeavy ? 'deadline' : 'deadline';
    var defaultWeight = forceHeavy ? 'heavy' : 'light';
    var html =
      '<h2>添加截止</h2>' +
      '<div class="field"><label>什么事</label><input type="text" id="fTitle" placeholder="比如：房租 / 投稿截止 / 游戏视频"></div>' +
      '<div class="field"><label>类型</label><div class="type-row" id="fTypes">' + typeChipsHTML(defaultType) + '</div></div>' +
      '<div class="field"><label>轻重</label><div class="weight-row" id="fWeights">' + weightChipsHTML(defaultWeight) + '</div></div>' +
      '<div id="fHeavyFields" style="display:' + (defaultWeight === 'heavy' ? 'block' : 'none') + '">' +
        '<div class="field"><label>开工日期（这天开始做这件事）</label><input type="date" id="fStart"></div>' +
        '<div class="field"><label>截稿日期（这天必须交）</label><input type="date" id="fDate" value="' + dateStr + '"></div>' +
      '</div>' +
      '<div id="fLightFields" style="display:' + (defaultWeight === 'light' ? 'block' : 'none') + '">' +
        '<div class="field"><label>重复</label><div class="repeat-row">' +
        '<button class="rep-chip on" data-rep="once">仅 ' + (+p[1]) + '月' + d + '日 这一次</button>' +
        '<button class="rep-chip" data-rep="monthly">每月 ' + d + ' 日</button></div></div>' +
      '</div>' +
      '<div class="sheet-actions"><button class="btn-main" id="fSave">保存</button>' +
      '<button class="btn-ghost gray" id="fCancel">取消</button></div>';
    openSheet(html);
    var selType = defaultType;
    var selWeight = defaultWeight;
    var selRep = 'once';
    function refreshWeightFields() {
      document.getElementById('fHeavyFields').style.display = selWeight === 'heavy' ? 'block' : 'none';
      document.getElementById('fLightFields').style.display = selWeight === 'light' ? 'block' : 'none';
    }
    sheet.querySelectorAll('.type-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        sheet.querySelectorAll('.type-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); selType = b.getAttribute('data-type');
      });
    });
    sheet.querySelectorAll('.weight-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        sheet.querySelectorAll('.weight-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); selWeight = b.getAttribute('data-w');
        refreshWeightFields();
      });
    });
    sheet.querySelectorAll('.rep-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        sheet.querySelectorAll('.rep-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); selRep = b.getAttribute('data-rep');
      });
    });
    document.getElementById('fCancel').addEventListener('click', closeSheet);
    document.getElementById('fSave').addEventListener('click', function () {
      var title = document.getElementById('fTitle').value.trim();
      if (!title) { toast('先写上是什么事'); return; }
      var ev = { id: 'e' + Date.now(), title: title, type: selType, weight: selWeight };
      if (selWeight === 'heavy') {
        var sd = document.getElementById('fStart').value;
        var dd = document.getElementById('fDate').value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dd)) { toast('请填截稿日期'); return; }
        ev.date = dd;
        if (/^\d{4}-\d{2}-\d{2}$/.test(sd)) ev.startDate = sd;
      } else {
        if (selRep === 'monthly') { ev.day = d; ev.repeat = 'monthly'; }
        else { ev.date = dateStr; }
      }
      state.events.push(ev);
      save(); closeSheet(); render(); toast('已添加');
    });
  }

  function openEditSheet(ev) {
    var isMonthly = ev.repeat === 'monthly';
    var isHeavy = ev.weight === 'heavy';
    var html =
      '<h2>编辑</h2>' +
      '<div class="field"><label>什么事</label><input type="text" id="fTitle"></div>' +
      '<div class="field"><label>类型</label><div class="type-row" id="fTypes">' + typeChipsHTML(ev.type) + '</div></div>' +
      '<div class="field"><label>轻重</label><div class="weight-row" id="fWeights">' + weightChipsHTML(isHeavy ? 'heavy' : 'light') + '</div></div>' +
      '<div id="fHeavyFields" style="display:' + (isHeavy ? 'block' : 'none') + '">' +
        '<div class="field"><label>开工日期（这天开始做）</label><input type="date" id="fStart" value="' + (ev.startDate || '') + '"></div>' +
        '<div class="field"><label>截稿日期（这天必须交）</label><input type="date" id="fDate" value="' + (ev.date || '') + '"></div>' +
      '</div>' +
      '<div id="fLightFields" style="display:' + (isHeavy ? 'none' : 'block') + '">' +
        (isMonthly
          ? '<div class="field"><label>每月 ' + ev.day + ' 日重复</label><div class="repeat-row">' +
            '<button class="rep-chip on" data-rep="monthly">保持每月重复</button>' +
            '<button class="rep-chip" data-rep="once">改成仅一次</button></div></div>'
          : '<div class="field"><label>日期</label><input type="date" id="fDateL" value="' + (ev.date || '') + '"></div>') +
      '</div>' +
      '<div class="sheet-actions"><button class="btn-main" id="fSave">保存</button>' +
      '<button class="btn-ghost" id="fDel">删除</button></div>';
    openSheet(html);
    document.getElementById('fTitle').value = ev.title;
    var selType = ev.type;
    var selWeight = isHeavy ? 'heavy' : 'light';
    var selRep = isMonthly ? 'monthly' : 'once';
    var changeToOnce = false;
    function refreshWeightFields() {
      document.getElementById('fHeavyFields').style.display = selWeight === 'heavy' ? 'block' : 'none';
      document.getElementById('fLightFields').style.display = selWeight === 'light' ? 'block' : 'none';
    }
    sheet.querySelectorAll('.type-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        sheet.querySelectorAll('.type-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); selType = b.getAttribute('data-type');
      });
    });
    sheet.querySelectorAll('.weight-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        sheet.querySelectorAll('.weight-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); selWeight = b.getAttribute('data-w');
        refreshWeightFields();
      });
    });
    sheet.querySelectorAll('.rep-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        sheet.querySelectorAll('.rep-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        changeToOnce = b.getAttribute('data-rep') === 'once';
      });
    });
    document.getElementById('fDel').addEventListener('click', function () {
      state.events = state.events.filter(function (e) { return e.id !== ev.id; });
      save(); closeSheet(); render(); toast('已删除');
    });
    document.getElementById('fSave').addEventListener('click', function () {
      ev.title = document.getElementById('fTitle').value.trim() || ev.title;
      ev.type = selType;
      ev.weight = selWeight;
      if (selWeight === 'heavy') {
        delete ev.repeat; delete ev.day;
        var sd = document.getElementById('fStart').value;
        var dd = document.getElementById('fDate').value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dd)) { toast('请填截稿日期'); return; }
        ev.date = dd;
        if (/^\d{4}-\d{2}-\d{2}$/.test(sd)) ev.startDate = sd; else delete ev.startDate;
      } else {
        delete ev.startDate;
        if (isMonthly) {
          if (changeToOnce) {
            var keepDay = ev.day;
            delete ev.repeat; delete ev.day;
            // 取从今天算起最近的一次出现，作为仅一次的日期
            var t = now0();
            var dim = daysInMonth(t.getFullYear(), t.getMonth());
            var dsThis = toStr(t.getFullYear(), t.getMonth(), Math.min(keepDay, dim));
            if (daysLeft(dsThis) >= 0) {
              ev.date = dsThis;
            } else {
              var nm = new Date(t.getFullYear(), t.getMonth() + 1, 1);
              var dim2 = daysInMonth(nm.getFullYear(), nm.getMonth());
              ev.date = toStr(nm.getFullYear(), nm.getMonth(), Math.min(keepDay, dim2));
            }
          }
          // 月重复保持原 day
        } else {
          var dv = document.getElementById('fDateL').value;
          if (/^\d{4}-\d{2}-\d{2}$/.test(dv)) ev.date = dv;
        }
      }
      save(); closeSheet(); render(); toast('已保存');
    });
  }

  // ---------- 钱（收入记录） ----------
  var INCOME_TYPES = ['外稿', '公积金提取', '零杂志兼职', '其他'];
  function openIncomeViewSheet(r) {
    openSheet(
      '<h2>' + escapeHTML(r.type || '收入') + '</h2>' +
      '<div class="mini-title">' + fmtDate(r.date) + ' · +' + fmtMoney(r.amount) + (r.note ? ' · ' + escapeHTML(r.note) : '') + '</div>' +
      '<div class="sheet-actions"><button class="btn-ghost" id="ivDel">删除</button>' +
      '<button class="btn-main" id="ivClose">关闭</button></div>'
    );
    document.getElementById('ivClose').addEventListener('click', closeSheet);
    document.getElementById('ivDel').addEventListener('click', function () {
      state.incomes = state.incomes.filter(function (x) { return x.id !== r.id; });
      save(); closeSheet(); render(); toast('已删除');
    });
  }
  function openIncomeAddSheet() {
    openSheet(
      '<h2>记一笔收入</h2>' +
      '<div class="field"><label>类型（选一个，或选"其他"自己填）</label><div class="type-row" id="ikRow">' +
      INCOME_TYPES.map(function (t, i) { return '<button class="type-chip' + (i === 0 ? ' on' : '') + '" data-t="' + t + '">' + t + '</button>'; }).join('') +
      '</div></div>' +
      '<div class="field" id="ikCustomWrap" style="display:none"><label>类型名（自己填）</label><input type="text" id="ikCustom" placeholder="如：兼职 / 转账 / 退款"></div>' +
      '<div class="field"><label>金额（元）</label><input type="number" inputmode="decimal" id="ifA" placeholder="如 1500"></div>' +
      '<div class="field"><label>日期</label><input type="date" id="ifD" value="' + todayStr() + '"></div>' +
      '<div class="field"><label>备注（可空）</label><input type="text" id="ifN" placeholder="如：书单外稿 / 某商单尾款"></div>' +
      '<div class="sheet-actions"><button class="btn-main" id="ifSave">记下</button>' +
      '<button class="btn-ghost gray" id="ifCancel">取消</button></div>'
    );
    var selType = INCOME_TYPES[0];
    sheet.querySelectorAll('#ikRow .type-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        selType = b.getAttribute('data-t');
        sheet.querySelectorAll('#ikRow .type-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        document.getElementById('ikCustomWrap').style.display = selType === '其他' ? 'block' : 'none';
      });
    });
    document.getElementById('ifCancel').addEventListener('click', closeSheet);
    document.getElementById('ifSave').addEventListener('click', function () {
      var amount = +document.getElementById('ifA').value || 0;
      if (!amount) { toast('金额填一下'); return; }
      var dv = document.getElementById('ifD').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dv)) { toast('日期不对'); return; }
      var t = selType;
      if (t === '其他') {
        var c = document.getElementById('ikCustom').value.trim();
        if (c) t = c;
      }
      state.incomes.push({ id: 'i' + Date.now(), date: dv, type: t, amount: amount, note: document.getElementById('ifN').value.trim() });
      save(); closeSheet(); render(); toast('记下了');
    });
  }
  document.getElementById('btnAddIncome').addEventListener('click', openIncomeAddSheet);

  // ---------- 累计 ----------
  var STAT_KINDS = { article: '稿子', video: '视频', money: '挣钱' };
  function fmtMoney(n) {
    n = +n || 0;
    var s = n % 1 === 0 ? String(n) : n.toFixed(1);
    return '¥' + (+s).toLocaleString('zh-CN');
  }
  function statAgg(list) {
    var a = 0, v = 0, m = 0;
    list.forEach(function (r) {
      if (r.kind === 'article') a += (+r.count || 0);
      else if (r.kind === 'video') v += (+r.count || 0);
      else if (r.kind === 'money') m += (+r.amount || 0);
    });
    return { a: a, v: v, m: m };
  }
  function aggText(x) {
    var parts = [];
    if (x.a) parts.push('稿 ' + x.a);
    if (x.v) parts.push('视频 ' + x.v);
    if (x.m) parts.push(fmtMoney(x.m));
    return parts.length ? parts.join(' · ') : '—';
  }
  function renderStats() {
    if (!state.stats) state.stats = [];
    var sumEl = document.getElementById('statsSum');
    var listEl = document.getElementById('statsList');
    var year = now0().getFullYear();
    var monthKey = todayStr().slice(0, 7);
    var thisYear = state.stats.filter(function (r) { return (r.date || '').slice(0, 4) === String(year); });
    var thisMonth = thisYear.filter(function (r) { return (r.date || '').slice(0, 7) === monthKey; });
    var y = statAgg(thisYear), mo = statAgg(thisMonth);
    sumEl.innerHTML =
      '<div class="stat-chip"><div class="k">今年累计</div><div class="v">' + escapeHTML(aggText(y)) + '</div></div>' +
      '<div class="stat-chip"><div class="k">本月</div><div class="v">' + escapeHTML(aggText(mo)) + '</div></div>';
    if (!state.stats.length) {
      listEl.innerHTML = '';
      return;
    }
    // 按月分组（倒序）
    var groups = {};
    state.stats.forEach(function (r) { var k = (r.date || '').slice(0, 7); (groups[k] = groups[k] || []).push(r); });
    var keys = Object.keys(groups).sort().reverse();
    var html = '';
    keys.forEach(function (k) {
      var g = groups[k];
      var label = k.slice(0, 4) === String(year) ? (+k.slice(5, 7)) + '月' : k.slice(0, 4) + '年' + (+k.slice(5, 7)) + '月';
      html += '<div class="stat-month">' + label + ' · ' + escapeHTML(aggText(statAgg(g))) + '</div>';
      g.sort(function (a, b) { return (b.date || '') < (a.date || '') ? -1 : 1; });
      g.forEach(function (r) {
        var val = r.kind === 'money' ? '+' + fmtMoney(r.amount) : '+' + (+r.count || 1);
        var sub = fmtShort(r.date) + (r.note ? ' · ' + escapeHTML(r.note) : '');
        html += '<div class="stat-item" data-id="' + r.id + '">' +
          '<div class="si-main"><div class="si-title">' + STAT_KINDS[r.kind] + '</div><div class="si-sub">' + sub + '</div></div>' +
          '<div class="si-val">' + val + '</div></div>';
      });
    });
    listEl.innerHTML = html;
    listEl.querySelectorAll('.stat-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        var r = state.stats.find(function (x) { return x.id === id; });
        if (r) openStatViewSheet(r);
      });
    });
  }
  function openStatViewSheet(r) {
    openSheet(
      '<h2>' + STAT_KINDS[r.kind] + '</h2>' +
      '<div class="mini-title">' + fmtDate(r.date) + (r.note ? ' · ' + escapeHTML(r.note) : '') + '</div>' +
      '<div class="sheet-actions"><button class="btn-ghost" id="svDel">删除</button>' +
      '<button class="btn-main" id="svClose">关闭</button></div>'
    );
    document.getElementById('svClose').addEventListener('click', closeSheet);
    document.getElementById('svDel').addEventListener('click', function () {
      state.stats = state.stats.filter(function (x) { return x.id !== r.id; });
      save(); closeSheet(); render(); toast('已删除');
    });
  }
  function openStatAddSheet() {
    openSheet(
      '<h2>记一笔</h2>' +
      '<div class="field"><label>类型</label><div class="type-row" id="skRow">' +
      '<button class="type-chip on" data-k="article">稿子</button>' +
      '<button class="type-chip" data-k="video">视频</button>' +
      '<button class="type-chip" data-k="money">挣钱</button></div></div>' +
      '<div class="field" id="sfCount"><label>数量（篇 / 个）</label><input type="number" inputmode="numeric" id="sfC" value="1"></div>' +
      '<div class="field" id="sfAmount" style="display:none"><label>金额（元）</label><input type="number" inputmode="decimal" id="sfA" placeholder="如 1500"></div>' +
      '<div class="field"><label>日期</label><input type="date" id="sfD" value="' + todayStr() + '"></div>' +
      '<div class="field"><label>备注（可空）</label><input type="text" id="sfN" placeholder="如：书单外稿 / GTA6首发视频"></div>' +
      '<div class="sheet-actions"><button class="btn-main" id="sfSave">记下</button>' +
      '<button class="btn-ghost gray" id="sfCancel">取消</button></div>'
    );
    var selKind = 'article';
    sheet.querySelectorAll('#skRow .type-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        selKind = b.getAttribute('data-k');
        sheet.querySelectorAll('#skRow .type-chip').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        document.getElementById('sfCount').style.display = selKind === 'money' ? 'none' : 'block';
        document.getElementById('sfAmount').style.display = selKind === 'money' ? 'block' : 'none';
      });
    });
    document.getElementById('sfCancel').addEventListener('click', closeSheet);
    document.getElementById('sfSave').addEventListener('click', function () {
      var dv = document.getElementById('sfD').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dv)) { toast('日期不对'); return; }
      var rec = { id: 's' + Date.now(), date: dv, kind: selKind, note: document.getElementById('sfN').value.trim() };
      if (selKind === 'money') {
        rec.amount = +document.getElementById('sfA').value || 0;
        if (!rec.amount) { toast('金额填一下'); return; }
      } else {
        rec.count = +document.getElementById('sfC').value || 1;
      }
      state.stats.push(rec);
      save(); closeSheet(); render(); toast('记下了');
    });
  }
  document.getElementById('btnAddStat').addEventListener('click', openStatAddSheet);

  // ---------- 导入导出 ----------
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  document.getElementById('btnExport').addEventListener('click', function () {
    var text = JSON.stringify(state);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制，粘贴到备忘录存着即可'); }, function () { openExportSheet(text); });
    } else openExportSheet(text);
  });
  function openExportSheet(text) {
    openSheet(
      '<h2>备份</h2><div class="mini-title">长按全选复制，粘贴到备忘录或发给自己：</div>' +
      '<textarea class="import-area" readonly id="expArea"></textarea>' +
      '<div class="sheet-actions"><button class="btn-main" id="shClose2">关闭</button></div>'
    );
    document.getElementById('expArea').value = text;
    document.getElementById('shClose2').addEventListener('click', closeSheet);
  }

  document.getElementById('btnImport').addEventListener('click', function () {
    openSheet(
      '<h2>导入数据</h2><div class="mini-title">把之前备份的那串文字粘贴到这里，会覆盖当前所有内容：</div>' +
      '<textarea class="import-area" id="impArea" placeholder="粘贴备份内容"></textarea>' +
      '<div class="sheet-actions"><button class="btn-main" id="impGo">导入</button>' +
      '<button class="btn-ghost gray" id="impNo">取消</button></div>'
    );
    document.getElementById('impNo').addEventListener('click', closeSheet);
    document.getElementById('impGo').addEventListener('click', function () {
      try {
        var d = JSON.parse(document.getElementById('impArea').value);
        var m = migrate(d);
        if (!m.events) throw 0;
        state = m; save(); closeSheet(); render(); toast('导入成功');
      } catch (e) { toast('内容不对，没导入'); }
    });
  });

  document.getElementById('btnAdd').addEventListener('click', function () { openAddSheet(todayStr()); });

  document.getElementById('btnPrev').addEventListener('click', function () { viewM--; if (viewM < 0) { viewM = 11; viewY--; } render(); });
  document.getElementById('btnNext').addEventListener('click', function () { viewM++; if (viewM > 11) { viewM = 0; viewY++; } render(); });
  document.getElementById('btnToday').addEventListener('click', function () { var t = new Date(); viewY = t.getFullYear(); viewM = t.getMonth(); render(); });

  if (window.NodeList && !NodeList.prototype.forEach) { NodeList.prototype.forEach = Array.prototype.forEach; }

  render();
})();
</script>
</body>
</html>
